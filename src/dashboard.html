<title>Petree</title>
<style>
  :root {
    --bg: #f6f6f3; --surface: #fff; --ink: #1e1e1c; --muted: #6b6b66;
    --line: #e3e3de; --accent: #3b7; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; --sp: 8px; --radius: 8px;
    /* activity view: sequential blue + its light track, and the reserved status
       steps (good/warning/critical) — always paired with a word, never color alone */
    --viz-blue: #2a78d6; --viz-track: #cde2fb;
    --st-good: #0ca30c; --st-warning: #fab219; --st-critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--sans); margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { padding: calc(var(--sp)*2) calc(var(--sp)*3); border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: .5px; }
  .wrap { padding: calc(var(--sp)*2) calc(var(--sp)*3); }
  .layout { display: flex; gap: calc(var(--sp)*3); align-items: flex-start; }
  .left { flex: 1 1 42%; min-width: 0; } .right { flex: 1 1 58%; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  form.create { padding: calc(var(--sp)*2); display: flex; flex-direction: column; gap: var(--sp); margin-bottom: calc(var(--sp)*2); }
  textarea { width: 100%; padding: var(--sp); font: inherit; border: 1px solid var(--line); border-radius: 6px; resize: none; overflow: hidden; min-height: 3rem; }
  .field { display: flex; gap: var(--sp); align-items: center; flex-wrap: wrap; font-size: .9rem; }
  .field > label.k { color: var(--muted); min-width: 3.5rem; }
  .field.repos-field { align-items: flex-start; }
  .combo { position: relative; flex: 1 1 auto; min-width: 220px; }
  .combo-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .combo-tags .tag { display: inline-flex; align-items: center; gap: 4px; background: #eef6ff; border: 1px solid var(--line); border-radius: 20px; padding: 2px 6px 2px 10px; font-size: .82rem; }
  .combo-tags .tag button { border: none; background: none; padding: 0; margin: 0; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; }
  .combo input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .combo-menu { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .combo-menu .opt { padding: 6px 10px; cursor: pointer; font-size: .9rem; }
  .combo-menu .opt:hover, .combo-menu .opt.active { background: #eef6ff; }
  .combo-menu .opt.sel { color: var(--muted); }
  .combo-menu .empty { padding: 6px 10px; color: var(--muted); font-size: .85rem; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: #faf8f2; } tr.sel { background: #eef6ff; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: .78rem; background: #eee; white-space: nowrap; }
  .badge.running { background: #cfe8ff; } .badge.done { background: #d4f3d4; } .badge.failed { background: #ffd7d7; }
  .badge[class*="paused"], .badge.waiting-for-you { background: #ffe9b8; }
  .badge.cancelled { background: #e3e3de; }
  .mono { font-family: var(--mono); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 var(--sp); }
  .tabs button { border: none; background: none; border-radius: 0; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tabbody { padding: calc(var(--sp)*2); }
  dl { margin: 0; } dt { color: var(--muted); font-size: .78rem; margin-top: 10px; } dd { margin: 2px 0 0; }
  .result h1,.result h2,.result h3 { font-size: 1rem; margin: .7rem 0 .3rem; }
  .result pre, pre.diff, pre.log { background: #16160f; color: #e6e6d8; padding: 12px; border-radius: 6px; overflow: auto; font-family: var(--mono); font-size: .82rem; }
  pre.log, pre.diff { max-height: 46vh; }
  .result code { background: #eee; padding: 0 .25rem; border-radius: 3px; font-family: var(--mono); }
  .result pre code { background: none; color: inherit; padding: 0; border-radius: 0; }
  .err { color: #b00020; white-space: pre-wrap; font-family: var(--mono); }
  .copy { font-size: .72rem; padding: 2px 8px; margin-left: 6px; }
  .cmd { display: flex; align-items: center; gap: 6px; background: #f0efe9; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: var(--mono); font-size: .8rem; overflow-x: auto; }
  .muted { color: var(--muted); } .small { font-size: .75rem; }
  /* create form: standing repo conventions that will be appended to the prompt */
  #conventions { border-top: 1px dashed var(--line); padding-top: var(--sp); }
  .conv { margin-top: 6px; } .conv-name { font-family: var(--mono); color: var(--ink); }
  .conv-text { white-space: pre-wrap; }
  .conv code { background: #f0efe9; border-radius: 3px; padding: 0 .25rem; font-family: var(--mono); }
  /* Log tab — activity view */
  .logbar { display: flex; align-items: center; gap: var(--sp); margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 12px; font-size: .82rem; color: var(--muted); }
  .seg button.on { background: var(--ink); color: #fff; }
  .follow { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
  .logscroll { max-height: 56vh; overflow: auto; }
  .logscroll pre.log { max-height: none; }
  .now { display: flex; gap: var(--sp); align-items: baseline; padding: 8px 10px; background: #fbfbf8;
         border: 1px solid var(--line); border-left: 3px solid var(--viz-blue); border-radius: 6px; }
  .now.bad { border-left-color: var(--st-critical); }
  .now-l { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); flex: none; }
  .now.live .now-l::before { content: '●'; color: var(--st-good); margin-right: 4px; animation: pulse 1.6s ease-in-out infinite; }
  .now-t { font-size: .88rem; overflow-wrap: anywhere; }
  @keyframes pulse { 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .now.live .now-l::before { animation: none } }
  .tiles { display: flex; flex-wrap: wrap; gap: var(--sp); margin: 10px 0; }
  .tile { flex: 1 1 88px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .tile-l { color: var(--muted); font-size: .72rem; }
  .tile-v { font-size: 1.15rem; font-weight: 600; }
  .tile-v.bad { color: var(--st-critical); }
  .meter-top { display: flex; justify-content: space-between; gap: var(--sp); font-size: .75rem; color: var(--muted); }
  .meter { height: 8px; margin-top: 3px; border-radius: 4px; background: var(--viz-track); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 4px; background: var(--viz-blue); }
  .meter-fill.warn { background: var(--st-warning); } .meter-fill.critical { background: var(--st-critical); }
  .chips, .files { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; font-size: .76rem; }
  .chip { border: 1px solid var(--line); border-radius: 20px; padding: 1px 9px; background: #faf9f5; }
  .plan { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 10px 0; background: #fbfbf8; }
  .plan-h { font-size: .78rem; font-weight: 600; margin-bottom: 4px; }
  .todos { list-style: none; margin: 0; padding: 0; font-size: .85rem; }
  .todo { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; }
  .todo-m { flex: none; width: 1em; }
  .todo-w { flex: none; width: 3.4em; font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .todo.completed { color: var(--muted); } .todo.in_progress { font-weight: 600; }
  .timeline { list-style: none; margin: 10px 0 0; padding: 0; border-left: 2px solid var(--line); }
  .ev { display: flex; gap: var(--sp); margin-left: -2px; padding: 5px 0 5px 10px; border-left: 2px solid transparent; }
  .ev-ico { flex: none; width: 1.2em; text-align: center; color: var(--muted); }
  .ev-main { flex: 1; min-width: 0; }
  .ev-head { font-size: .85rem; overflow-wrap: anywhere; }
  .ev-name { font-weight: 600; }
  .ev-sum { font-family: var(--mono); font-size: .8rem; color: #3d3d38; }
  .ev-text .ev-sum { font-family: var(--sans); font-size: .88rem; color: var(--ink); }
  .ev-thinking .ev-sum { font-family: var(--sans); font-style: italic; color: var(--muted); }
  .ev-raw { color: var(--muted); } .ev-raw .ev-sum { font-size: .75rem; }
  .ev-result { border-left-color: var(--st-good); } .ev-error { border-left-color: var(--st-critical); }
  .ev-tag { font-size: .7rem; border-radius: 20px; padding: 0 6px; background: #eee; color: var(--muted); }
  .ev-tag.good { background: #e3f6e3; color: #0a6b0a; } .ev-tag.bad { background: #fde3e3; color: #a32020; }
  .ev-more { margin-top: 3px; }
  .ev-more summary { font-size: .72rem; color: var(--muted); cursor: pointer; }
  .ev-more pre { background: #16160f; color: #e6e6d8; padding: 8px; border-radius: 6px; margin: 4px 0 0;
                 max-height: 30vh; overflow: auto; font-family: var(--mono); font-size: .75rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 820px) { .layout { flex-direction: column; } .left, .right { flex: 1 1 100%; } }
  /* settings: popup modal, not an inline panel */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,16,.35); display: flex; align-items: center; justify-content: center; padding: calc(var(--sp)*2); z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: calc(var(--sp)*2.5); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: calc(var(--sp)*1.5); }
  .modal-head h2 { margin: 0; font-size: 1rem; }
  .modal-close { border: none; background: none; font-size: 1.2rem; line-height: 1; padding: 2px 6px; color: var(--muted); }
  .modal-section { border-top: 1px dashed var(--line); padding-top: calc(var(--sp)*1.5); margin-top: calc(var(--sp)*1.5); }
  .modal-section.first { border-top: none; padding-top: 0; margin-top: 0; }
  .modal-section h3 { margin: 0 0 8px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #reposYamlText { min-height: 40vh; font-family: var(--mono); font-size: .82rem; resize: vertical; overflow: auto; white-space: pre; }
  /* Repos tab: master/detail — searchable repo list on the left, form on the right */
  .repos-editor { display: flex; gap: calc(var(--sp)*2); align-items: flex-start; }
  .repos-list-col { flex: 0 0 200px; min-width: 0; }
  .repos-list-col input[type="text"] { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .repo-list { margin-top: 6px; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  .repo-list .item { padding: 6px 10px; cursor: pointer; font-size: .88rem; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .repo-list .item:last-child { border-bottom: none; }
  .repo-list .item:hover, .repo-list .item.active { background: #eef6ff; }
  .repo-list .empty { padding: 6px 10px; color: var(--muted); font-size: .85rem; }
  .repos-detail-col { flex: 1 1 auto; min-width: 0; }
</style>
<header style="display:flex;align-items:center;justify-content:space-between">
  <h1>🧫 Petree</h1>
  <button type="button" id="settingsBtn">⚙ settings</button>
</header>
<div class="modal-overlay" id="settingsOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">⚙ Settings</h2>
      <button type="button" class="modal-close" id="settingsClose" aria-label="close">×</button>
    </div>
    <div class="tabs" id="settingsTabs"></div>
    <div class="tabbody" id="settingsTabBody"></div>
    <div class="field" style="margin-top:calc(var(--sp)*1.5);border-top:1px solid var(--line);padding-top:calc(var(--sp)*1.5)">
      <button class="primary" type="button" id="saveSettings">Save</button>
      <span class="muted small" id="settingsMsg"></span>
    </div>
  </div>
</div>
<div class="wrap">
  <form class="create card" id="create">
    <textarea name="prompt" id="prompt" placeholder="task prompt — Cmd/Ctrl+Enter to start" required></textarea>
    <div class="field repos-field">
      <label class="k">repos</label>
      <div class="combo" id="repoCombo">
        <div class="combo-tags" id="repoTags"></div>
        <input type="text" id="repoSearch" placeholder="search repos…" autocomplete="off">
        <div class="combo-menu" id="repoMenu" hidden></div>
      </div>
    </div>
    <div class="small muted" id="conventions" hidden></div>
    <div class="field"><label class="k">model</label>
      <select id="model">
        <option value="default">default</option><option value="haiku">haiku</option>
        <option value="sonnet">sonnet</option><option value="opus">opus</option>
      </select>
      <button class="primary" type="submit" style="margin-left:auto">Start task</button>
    </div>
  </form>
  <div class="layout">
    <div class="left card"><table><thead><tr><th>id</th><th>state</th><th>repos</th><th>tokens</th></tr></thead><tbody id="tasks"></tbody></table></div>
    <div class="right card">
      <div class="tabs" id="tabs"></div>
      <div class="tabbody" id="tabbody"><p class="muted">Select a task to see details.</p></div>
    </div>
  </div>
</div>
<script type="module">
  import { renderMarkdown } from './markdown.js'
  import { renderActivity } from './activity.js'
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  // One command/URL per line, blank lines dropped — shared by allow-clone and repo setup/build/test/skills fields.
  const linesToList = (s) => s.split('\n').map((x) => x.trim()).filter(Boolean)
  let selected = null, tab = 'Overview', resultShownFor = null
  const TABS = ['Overview', 'Result', 'Changes', 'Log']
  // Log view preferences survive the 3s poll and page reloads
  let logView = localStorage.getItem('petree-logview') || 'Activity'
  let followLog = localStorage.getItem('petree-logfollow') !== 'off'

  // Identifies an expanded log detail by its content (headline + section), not by
  // position — the timeline is capped to the last N events, so indices shift as
  // the run grows while the text of an event does not.
  const detailKey = (d) =>
    (d.closest('.ev')?.querySelector('.ev-head')?.textContent ?? '') + '¦' + (d.querySelector('summary')?.textContent ?? '')

  // copy button: returns HTML; clicking copies decodeURIComponent of data-copy
  function copyBtn(text) { return `<button class="copy" data-copy="${encodeURIComponent(text)}">copy</button>` }
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('.copy'); if (!b) return
    try { await navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)); const o = b.textContent; b.textContent = 'copied'; setTimeout(() => (b.textContent = o), 1200) } catch {}
  })

  // create form — repo combo: searchable, multiselect
  let allRepos = [], selectedRepos = []
  const repoSearch = document.getElementById('repoSearch')
  const repoMenu = document.getElementById('repoMenu')
  const repoTags = document.getElementById('repoTags')
  const conventions = document.getElementById('conventions')
  // Refreshes the create-task form's repo list/conventions — called on initial
  // load and after any edit that may have added/removed/renamed repos (raw-YAML
  // apply, settings save).
  function refreshRepoList() {
    return fetch('/api/repos').then((r) => r.json()).then((repos) => { allRepos = repos; renderRepoMenu(); renderConventions() })
  }
  refreshRepoList()

  function renderRepoTags() {
    repoTags.innerHTML = selectedRepos.map((name) => `<span class="tag">${esc(name)}<button type="button" data-remove="${esc(name)}" aria-label="remove ${esc(name)}">×</button></span>`).join('')
    renderConventions()
  }
  // Mirrors composePrompt() in src/prompt.ts: what repos.yaml will append to the
  // prompt for the repos currently selected.
  const cmdLine = (label, list) =>
    list && list.length ? `<div>${label}: ${list.map((c) => `<code>${esc(c)}</code>`).join(' ')}</div>` : ''
  function renderConventions() {
    const active = allRepos.filter((r) => selectedRepos.includes(r.name) &&
      (r.instructions || r.setup?.length || r.build?.length || r.test?.length))
    conventions.hidden = active.length === 0
    conventions.innerHTML = active.length
      ? 'repo conventions appended to this prompt:' + active.map((r) => `<div class="conv">
          <span class="conv-name">${esc(r.name)}</span>
          ${r.instructions ? `<div class="conv-text">${esc(r.instructions)}</div>` : ''}
          ${cmdLine('setup', r.setup)}${cmdLine('build', r.build)}${cmdLine('test', r.test)}</div>`).join('')
      : ''
  }
  function renderRepoMenu() {
    const q = repoSearch.value.trim().toLowerCase()
    const matches = allRepos.filter((r) => r.name.toLowerCase().includes(q))
    repoMenu.innerHTML = matches.length
      ? matches.map((r) => `<div class="opt ${selectedRepos.includes(r.name) ? 'sel' : ''}" data-repo="${esc(r.name)}">${selectedRepos.includes(r.name) ? '✓ ' : ''}${esc(r.name)}</div>`).join('')
      : '<div class="empty">no matching repos</div>'
  }
  function toggleRepo(name) {
    const i = selectedRepos.indexOf(name)
    if (i === -1) selectedRepos.push(name); else selectedRepos.splice(i, 1)
    renderRepoTags(); renderRepoMenu()
  }
  repoSearch.addEventListener('input', () => { renderRepoMenu(); repoMenu.hidden = false })
  repoSearch.addEventListener('focus', () => { renderRepoMenu(); repoMenu.hidden = false })
  repoSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { repoMenu.hidden = true; return }
    if (e.key !== 'Enter') return
    e.preventDefault()
    const first = repoMenu.querySelector('.opt[data-repo]')
    if (first) { toggleRepo(first.dataset.repo); repoSearch.value = '' }
  })
  document.addEventListener('click', (e) => { if (!e.target.closest('#repoCombo')) repoMenu.hidden = true })
  repoMenu.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt[data-repo]'); if (!opt) return
    toggleRepo(opt.dataset.repo); repoSearch.value = ''; repoSearch.focus()
  })
  repoTags.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-remove]'); if (!b) return
    selectedRepos = selectedRepos.filter((n) => n !== b.dataset.remove)
    renderRepoTags(); renderRepoMenu()
  })

  // settings modal: tabbed editor — General (retention + defaults + allow-clone),
  // Repos (master/detail per-repo config) and Advanced (raw repos.yaml escape
  // hatch). General + Repos share ONE in-memory draft fetched once on open
  // (GET /api/settings + GET /api/config) so switching tabs is instant and never
  // drops unsaved edits; the one footer Save button validates the whole draft and
  // writes it back via PUT /api/settings + PUT /api/config. Advanced talks to
  // /api/repos-yaml directly and intentionally does NOT preview the draft.
  const settingsBtn = document.getElementById('settingsBtn')
  const settingsOverlay = document.getElementById('settingsOverlay')
  const settingsTabsEl = document.getElementById('settingsTabs')
  const settingsTabBody = document.getElementById('settingsTabBody')
  const settingsMsg = document.getElementById('settingsMsg')
  const flashSettingsMsg = (text) => { settingsMsg.textContent = text; setTimeout(() => (settingsMsg.textContent = ''), 2500) }
  // Override choices for a model select; "(use default)" (empty value, stored as null)
  // is rendered separately so there's exactly one representation of "no override"
  // (resolveModel in src/config.ts treats null and the literal string 'default' as
  // equivalent, but storing null — and omitting default_model from repos.yaml — is tidier).
  const MODEL_OPTS = ['haiku', 'sonnet', 'opus']
  const SETTINGS_TABS = ['General', 'Repos', 'Advanced']

  let draft = null // { retention: {maxAgeDays, maxPerRepoGroup}, defaults: {...}, repos: {name: {...}}, allowClone: [] }
  let settingsTab = 'General'
  let selectedRepoName = null
  let addingRepo = false
  let repoListFilter = ''
  let rawYamlCache = null // cached /api/repos-yaml content for this modal session; cleared on open, refreshed after a successful apply

  const isPosInt = (v) => Number.isInteger(v) && v > 0
  const emptyRepo = () => ({ url: '', image: '', defaultBranch: 'main', defaultModel: null, instructions: '', setup: [], build: [], test: [], skills: [] })

  async function loadDraft() {
    const [settings, config] = await Promise.all([
      fetch('/api/settings').then((r) => r.json()),
      fetch('/api/config').then((r) => r.json()),
    ])
    draft = {
      retention: { maxAgeDays: settings.maxAgeDays, maxPerRepoGroup: settings.maxPerRepoGroup },
      defaults: {
        timeoutMinutes: config.defaults?.timeoutMinutes,
        tokenBudget: config.defaults?.tokenBudget,
        concurrency: config.defaults?.concurrency,
        defaultModel: config.defaults?.defaultModel && config.defaults.defaultModel !== 'default' ? config.defaults.defaultModel : null,
        instructions: config.defaults?.instructions || '',
      },
      repos: config.repos || {},
      allowClone: config.allowClone || [],
    }
  }

  function openSettings() {
    settingsOverlay.hidden = false
    settingsTab = 'General'; selectedRepoName = null; addingRepo = false; repoListFilter = ''
    rawYamlCache = null
    settingsTabBody.innerHTML = '<p class="muted">loading…</p>'
    loadDraft().then(renderSettingsTabs)
  }
  function closeSettings() { settingsOverlay.hidden = true }
  settingsBtn.addEventListener('click', openSettings)
  document.getElementById('settingsClose').addEventListener('click', closeSettings)
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings() })

  function renderAdvancedTab() {
    settingsTabBody.innerHTML = `
      <p class="muted small" style="margin:0 0 8px">Edits apply immediately to new tasks — no restart required. This is a raw-text escape hatch: it bypasses the structured validation on the other tabs and can preserve comments/formatting the structured editor cannot.</p>
      <textarea id="reposYamlText" spellcheck="false"></textarea>
      <div class="field" style="margin-top:8px">
        <button class="primary" type="button" id="applyRawYamlBtn">Apply raw YAML</button>
        <span class="muted small" id="reposYamlMsg"></span>
      </div>`
    const reposYamlText = document.getElementById('reposYamlText')
    const reposYamlMsg = document.getElementById('reposYamlMsg')
    const flashReposYamlMsg = (text) => { reposYamlMsg.textContent = text; setTimeout(() => (reposYamlMsg.textContent = ''), 2500) }
    if (rawYamlCache === null) {
      reposYamlText.value = 'loading…'
      fetch('/api/repos-yaml').then((r) => r.json()).then(({ content }) => { rawYamlCache = content; reposYamlText.value = content })
    } else {
      reposYamlText.value = rawYamlCache
    }
    document.getElementById('applyRawYamlBtn').addEventListener('click', async () => {
      const res = await fetch('/api/repos-yaml', {
        method: 'PUT', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content: reposYamlText.value }),
      })
      if (!res.ok) { flashReposYamlMsg((await res.json()).error || 'failed to apply'); return }
      flashReposYamlMsg('applied')
      // the file now holds exactly reposYamlText.value — cache it rather than refetching
      rawYamlCache = reposYamlText.value
      // the raw apply may have changed defaults/repos/allowClone — reset the in-memory draft
      // from the server (so switching back to General/Repos doesn't show stale data) and
      // refresh the create-form's repo list, concurrently — neither depends on the other
      await Promise.all([loadDraft(), refreshRepoList()])
    })
  }

  // Validates the whole draft client-side; returns null when valid, or
  // { tab, message, repo? } identifying the first tab/field to surface.
  function validateDraft() {
    const genErrors = []
    if (!isPosInt(draft.retention.maxAgeDays)) genErrors.push('clear after: must be a positive integer')
    if (!isPosInt(draft.retention.maxPerRepoGroup)) genErrors.push('keep per repo group: must be a positive integer')
    if (!isPosInt(draft.defaults.timeoutMinutes)) genErrors.push('timeout: must be a positive integer')
    if (!isPosInt(draft.defaults.tokenBudget)) genErrors.push('token budget: must be a positive integer')
    if (!isPosInt(draft.defaults.concurrency)) genErrors.push('concurrency: must be a positive integer')
    if (genErrors.length) return { tab: 'General', message: genErrors.join('; ') }

    const repoErrors = []
    let firstBadRepo = null
    for (const [name, r] of Object.entries(draft.repos)) {
      if (!r.url?.trim() || !r.image?.trim()) {
        repoErrors.push(`"${name}": url and image are required`)
        if (!firstBadRepo) firstBadRepo = name
      }
    }
    if (repoErrors.length) return { tab: 'Repos', message: repoErrors.join('; '), repo: firstBadRepo }
    return null
  }

  document.getElementById('saveSettings').addEventListener('click', async () => {
    const invalid = validateDraft()
    if (invalid) {
      settingsTab = invalid.tab
      if (invalid.repo) selectedRepoName = invalid.repo
      renderSettingsTabs()
      const errEl = document.getElementById(invalid.tab === 'General' ? 'generalErr' : 'repoErr')
      if (errEl) errEl.textContent = invalid.message
      flashSettingsMsg('fix the highlighted fields')
      return
    }
    const [settingsRes, configRes] = await Promise.all([
      fetch('/api/settings', {
        method: 'PUT', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ maxAgeDays: draft.retention.maxAgeDays, maxPerRepoGroup: draft.retention.maxPerRepoGroup }),
      }),
      fetch('/api/config', {
        method: 'PUT', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ defaults: draft.defaults, repos: draft.repos, allowClone: draft.allowClone }),
      }),
    ])
    if (!settingsRes.ok || !configRes.ok) {
      const errs = await Promise.all([settingsRes, configRes].map(async (r) => (r.ok ? null : (await r.json().catch(() => ({}))).error)))
      flashSettingsMsg(errs.filter(Boolean).join('; ') || 'failed to save')
      return
    }
    flashSettingsMsg('saved')
    refresh()
    refreshRepoList() // repos may have been added/removed/renamed
  })

  const prompt = document.getElementById('prompt')
  const autosize = () => { prompt.style.height = 'auto'; prompt.style.height = prompt.scrollHeight + 'px' }
  prompt.value = localStorage.getItem('petree-draft') || ''; autosize()
  prompt.addEventListener('input', () => { localStorage.setItem('petree-draft', prompt.value); autosize() })
  prompt.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); document.getElementById('create').requestSubmit() } })
  document.getElementById('create').addEventListener('submit', async (e) => {
    e.preventDefault()
    if (!selectedRepos.length) { alert('select at least one repo'); return }
    await fetch('/api/tasks', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: prompt.value, repos: selectedRepos, model: document.getElementById('model').value }) })
    prompt.value = ''; localStorage.removeItem('petree-draft'); autosize()
    selectedRepos = []; renderRepoTags(); renderRepoMenu()
    refresh()
  })

  function taskRow(t) {
    return `<tr class="${t.id === selected ? 'sel' : ''}" data-id="${esc(t.id)}">
      <td class="mono">${esc(t.id)}</td><td><span class="badge ${esc(t.state)}">${esc(t.state)}</span></td>

  document.getElementById('tasks').addEventListener('click', (e) => {

  function renderTabs() {

  async function renderBody() {
    const body = document.getElementById('tabbody')
    if (!selected) { body.innerHTML = '<p class="muted">Select a task to see details.</p>'; return }
    const t = await (await fetch('/api/tasks/' + selected)).json()
    renderTabs()
    if (tab === 'Overview') {
      const resume = ['paused-limit', 'paused-rate-limit', 'waiting-for-you', 'failed', 'cancelled'].includes(t.state)
        ? `<button data-resume="${esc(t.id)}">resume</button>` : ''
      const stop = ['queued', 'provisioning', 'running'].includes(t.state)
        ? `<button data-stop="${esc(t.id)}">stop</button>` : ''
      body.innerHTML = `<dl>
        <dt>state</dt><dd><span class="badge ${esc(t.state)}">${esc(t.state)}</span> ${resume} ${stop}</dd>
        <dt>id</dt><dd class="mono">${esc(t.id)} ${copyBtn(t.id)}</dd>
        <dt>prompt</dt><dd>${esc(t.prompt)}</dd>
        <dt>repos</dt><dd>${esc(t.repos.join(', '))}</dd>
        <dt>model</dt><dd>${esc(t.model || 'default')}</dd>
        <dt>tokens</dt><dd>${esc(t.tokensUsed)} / ${esc(t.tokenBudget)}</dd>
        <dt>session</dt><dd class="mono">${esc(t.sessionId || '—')} ${t.sessionId ? copyBtn(t.sessionId) : ''}</dd>
        <dt>created / updated</dt><dd class="mono">${esc(t.createdAt)} · ${esc(t.updatedAt)}</dd>
        ${t.state === 'failed' && t.error ? `<dt>error</dt><dd class="err">${esc(t.error)}</dd>` : ''}
      </dl>
        ${['done', 'failed', 'cancelled'].includes(t.state) ? `
        <div class="card" style="margin-top:16px;padding:12px">
          <dt>next prompt</dt>
          <textarea id="nextPrompt" placeholder="follow-up prompt — continues this task's session, branch and workspace"></textarea>
          <div class="field" style="margin-top:8px">
            <label class="k">model</label>
            <select id="nextModel">
              ${['default', 'haiku', 'sonnet', 'opus'].map((m) => `<option value="${m}" ${(t.model || 'default') === m ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
            <button class="primary" data-next="${esc(t.id)}" style="margin-left:auto">Continue task</button>
          </div>
        </div>` : ''}`
    } else if (tab === 'Result') {
      const history = (t.turns || []).map((turn, i) => `
        <details class="card" style="margin-bottom:8px;padding:8px">
          <summary class="muted">turn ${i + 1} — ${esc(turn.prompt.split('\n')[0].slice(0, 80))} <span class="small">(${esc(turn.tokensUsed)} tokens)</span></summary>
          <dt>prompt</dt><dd>${esc(turn.prompt)}</dd>
          <dt>result</dt>
          <div class="result">${turn.result ? renderMarkdown(turn.result) : '<p class="muted">no result recorded</p>'}</div>
        </details>`).join('')
      if (t.state !== 'done' || !t.result) {
        body.innerHTML = history + '<p class="muted">No result yet.</p>'
      } else {
        // Once rendered for this task, the poll loop stops re-entering this branch (see
        // refresh()) — like Changes, the PR target input and in-flight request here would
        // otherwise get reset/detached out from under the user every 3s.
        resultShownFor = selected
        body.innerHTML = history + `<div><button class="copy" data-copy="${encodeURIComponent(t.result)}">copy markdown</button></div>
          <div class="result">${renderMarkdown(t.result)}</div>
          <div class="card" id="prSection" style="margin-top:16px;padding:12px"><p class="muted">loading repos…</p></div>`
        const repos = await (await fetch('/api/tasks/' + selected + '/diff')).json()
        const changed = repos.filter((r) => r.hasChanges)
        const prSection = document.getElementById('prSection')
        prSection.innerHTML = changed.length
          ? `<dt>open a pull request</dt>` + changed.map((r) => `<div class="field" style="margin:6px 0">
              <strong>${esc(r.repo)}</strong>
              <input class="mono" data-pr-target="${esc(r.repo)}" value="${esc(r.branch)}" style="padding:6px;border:1px solid var(--line);border-radius:6px">
              <button data-pr="${esc(r.repo)}">Create PR</button>
              <span class="prout muted" data-prout="${esc(r.repo)}"></span>
            </div>`).join('')
          : '<p class="muted">No changes to open a PR for.</p>'
        prSection.querySelectorAll('[data-pr]').forEach((btn) => btn.addEventListener('click', async () => {
          const repo = btn.dataset.pr
          const sel = CSS.escape(repo)
          const target = prSection.querySelector(`[data-pr-target="${sel}"]`).value
          const out = prSection.querySelector(`[data-prout="${sel}"]`)
          out.textContent = 'creating…'
          const res = await (await fetch('/api/tasks/' + selected + '/pr', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ repo, target }),
          })).json()
          out.innerHTML = res.ok
            ? `✓ <a href="${esc(res.url)}" target="_blank" rel="noopener noreferrer">${esc(res.url)}</a>`
            : '✗ ' + esc((res.output || res.error || 'failed').split('\n').slice(-2).join(' '))
        }))
      }
    } else if (tab === 'Log') {
      const logs = await (await fetch('/api/tasks/' + selected + '/logs')).text()
      // The poll re-renders this tab every 3s, so carry the reading position and
      // any expanded details across renders — otherwise the log scrolls itself
      // back to the top under the user mid-read.
      const prev = body.querySelector('.logscroll')
      const at = prev ? prev.scrollTop : 0
      const atEnd = prev ? prev.scrollHeight - prev.scrollTop - prev.clientHeight < 40 : true
      const wasOpen = new Set([...body.querySelectorAll('.ev-more[open]')].map(detailKey))
      body.innerHTML = `<div class="logbar">
          <div class="seg">${['Activity', 'Raw'].map((v) => `<button class="${v === logView ? 'on' : ''}" data-logview="${v}">${v}</button>`).join('')}</div>
          <label class="follow"><input type="checkbox" id="followLog" ${followLog ? 'checked' : ''}> follow</label>
        </div>
        <div class="logscroll">${logView === 'Raw' ? `<pre class="log">${esc(logs)}</pre>` : renderActivity(logs, t)}</div>`
      body.querySelectorAll('.ev-more').forEach((d) => { if (wasOpen.has(detailKey(d))) d.open = true })
      const scroller = body.querySelector('.logscroll')
      scroller.scrollTop = followLog && atEnd ? scroller.scrollHeight : at
      body.querySelectorAll('[data-logview]').forEach((b) => b.addEventListener('click', () => {
        logView = b.dataset.logview; localStorage.setItem('petree-logview', logView); renderBody()
      }))
      document.getElementById('followLog').addEventListener('change', (e) => {
        followLog = e.target.checked
        localStorage.setItem('petree-logfollow', followLog ? 'on' : 'off')
        if (followLog) scroller.scrollTop = scroller.scrollHeight
      })
    } else if (tab === 'Changes') {
      body.innerHTML = '<p class="muted">loading changes…</p>'
      const repos = await (await fetch('/api/tasks/' + selected + '/diff')).json()
      body.innerHTML = repos.map((r) => {
        if (!r.hasChanges) return `<div class="repoChange"><strong>${esc(r.repo)}</strong> <span class="muted">— no changes for this task</span></div>`
        const cmd = r.reviewCommand
        return `<div class="repoChange" style="margin-bottom:16px">
          <div><strong>${esc(r.repo)}</strong> <span class="muted mono">${esc(r.branch)} vs ${esc(r.baseBranch)}</span></div>
          <dt>review locally</dt>
          <div class="cmd"><span>${esc(cmd)}</span>${copyBtn(cmd)}</div>
          <dt>summary</dt><pre class="diff" style="max-height:none">${esc(r.stat)}</pre>
          <dt>diff</dt>
          <div><button class="copy" data-copy="${encodeURIComponent(r.patch)}">copy diff</button></div>
          <pre class="diff">${esc(r.patch)}</pre>
          <dt>push</dt>
          <div class="field">
            <input class="mono" data-target="${esc(r.repo)}" value="${esc(r.branch)}" style="padding:6px;border:1px solid var(--line);border-radius:6px">
            <button data-push="${esc(r.repo)}">Push branch</button>
            <span class="pushout muted" data-out="${esc(r.repo)}"></span>
          </div>
        </div>`
      }).join('')
      body.querySelectorAll('[data-push]').forEach((btn) => btn.addEventListener('click', async () => {
        const repo = btn.dataset.push
        const sel = CSS.escape(repo)
        const target = body.querySelector(`[data-target="${sel}"]`).value
        const out = body.querySelector(`[data-out="${sel}"]`)
        out.textContent = 'pushing…'
        const res = await (await fetch('/api/tasks/' + selected + '/push', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ repo, target }),
        })).json()
        // Validation failures (400s) come back as { error }, not { output } — fall back to it
        // so the user sees the actual reason instead of a generic "failed".
        out.textContent = res.ok ? '✓ ' + (res.output || 'pushed').split('\n')[0] : '✗ ' + (res.output || res.error || 'failed').split('\n').slice(-2).join(' ')
      }))
    }
    document.querySelectorAll('[data-resume]').forEach((b) => b.addEventListener('click', async () => {
      await fetch('/api/tasks/' + b.dataset.resume + '/resume', { method: 'POST' }); refresh()
    }))
    document.querySelectorAll('[data-stop]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Stop this task? This will kill it.')) return
      await fetch('/api/tasks/' + b.dataset.stop + '/stop', { method: 'POST' }); refresh()
    }))
    document.querySelectorAll('[data-next]').forEach((b) => b.addEventListener('click', async () => {
      const ta = document.getElementById('nextPrompt')
      if (!ta.value.trim()) { alert('enter a follow-up prompt'); return }
      const res = await fetch('/api/tasks/' + b.dataset.next + '/next', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt: ta.value, model: document.getElementById('nextModel').value }),
      })
      if (!res.ok) { alert((await res.json()).error || 'follow-up failed'); return }
      resultShownFor = null
      refresh()
    }))
    const nextTa = document.getElementById('nextPrompt')
    if (nextTa) nextTa.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-next]').click() }
    })
  }

  async function refresh() {
    const tasks = await (await fetch('/api/tasks')).json()
    document.getElementById('tasks').innerHTML = tasks.map(taskRow).join('')
    renderTabs()
    // Only auto-refresh live tabs; Changes renders on tab entry only so the 3s
    // poll can't reset the push-target input, re-run git diff, or detach the
    // push-result node mid-push. Result is live only until its done-result (with
    // PR controls) has been rendered once for this task — after that it's frozen
    // for the same reason as Changes (the PR target input, once shown, must survive
    // the poll; the underlying result can't change post-done anyway).
    const resultLive = tab === 'Result' && resultShownFor !== selected
    // Don't re-render under the user's caret: the Overview next-prompt form (and
    // any other input in the detail panel) must survive the 3s poll while focused.
    const active = document.activeElement
    const typing = active && document.getElementById('tabbody').contains(active) &&
      ['TEXTAREA', 'INPUT', 'SELECT'].includes(active.tagName)
    if (selected && !typing && (tab === 'Overview' || tab === 'Log' || resultLive)) await renderBody()
  }
  setInterval(refresh, 3000); refresh()
</script>
